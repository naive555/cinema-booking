server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback — every unmatched path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket — specific location before the /api/ prefix block
    # so nginx applies the Upgrade/Connection headers correctly.
    location /api/ws {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # REST API
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # OAuth routes — only the /auth/google/ sub-path goes to the backend.
    # /auth/callback is served by the SPA (Vue Router) via the / block above.
    location /auth/google/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Dev-token endpoint (only active when DEV_AUTH=true in backend)
    location /dev/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
